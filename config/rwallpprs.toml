# RWallpprs v0.2.0-beta.2 configuration for Niri (Arch Linux)

[general]
layer = "background"
log_level = "info"

[video]
# Hardware decoder backend for libavcodec: "auto" | "vaapi" | "vulkan" | "nvdec" | "vdpau" | "software"
hw_accel = "auto"
# DRM render node used by VA-API
drm_render_node = "/dev/dri/renderD128"
scale_mode = "fill"
fps_limit = 60
loop_playback = true

[rust_engine]
default_mode = "animated"
target_fps = 60
double_buffering = true
forward_niri_events = true

[power_saving]
enabled = true
auto_hide_surface = true
pause_on_fullscreen = true
pause_on_maximized_column = true
# Fraction of monitor width (0.0..=1.0) at which the active Niri column is considered to cover the whole background
maximized_column_threshold = 0.96
wake_on_niri_overview = true
# Freeze the wallpaper on the last frame while on battery at or below this percentage.
# 0 disables the rule. Run `rwallpprs power --battery-limit N` to change it at runtime.
battery_freeze_threshold = 25
# How often the battery sysfs is re-read while the rule above is active.
battery_poll_interval_sec = 15
